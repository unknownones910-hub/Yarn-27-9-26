<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Illustration of a basket of yarn balls in warm terracotta, sage and cream">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF3E8"/>
      <stop offset="100%" stop-color="#F0E2CE"/>
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="600"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="600" fill="url(#sky)"/>

    <!-- soft light pool -->
    <ellipse cx="560" cy="120" rx="300" ry="220" fill="#FFF9F0" opacity=".8"/>

    <!-- table edge -->
    <rect y="440" width="800" height="160" fill="#E4D3BC"/>
    <rect y="440" width="800" height="8" fill="#D8C3A9"/>

    <!-- yarn ball: sage -->
    <g transform="translate(215 380)">
      <circle r="86" fill="#8FA383"/>
      <g fill="none" stroke="#7A8F6E" stroke-width="4.5" stroke-linecap="round" opacity=".85">
        <path d="M-62 -58c26 18 47 47 56 79M-30 -80c31 23 55 61 66 104M28 -81c20 21 36 51 44 82M-81 -17c17 14 32 33 41 55"/>
      </g>
      <path d="M78 -34c34 -16 62 -4 74 22" fill="none" stroke="#7A8F6E" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- yarn ball: terracotta (hero) -->
    <g transform="translate(400 330)">
      <circle r="112" fill="#C4663C"/>
      <g fill="none" stroke="#A6512C" stroke-width="5.5" stroke-linecap="round" opacity=".85">
        <path d="M-80 -76c34 24 61 62 73 103M-39 -104c40 30 72 79 86 135M36 -106c26 27 47 66 57 107M-105 -22c22 18 42 43 53 71"/>
      </g>
      <path d="M104 -44c46 -20 84 -2 98 34" fill="none" stroke="#A6512C" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- yarn ball: cream -->
    <g transform="translate(590 400)">
      <circle r="74" fill="#F3E6D2"/>
      <g fill="none" stroke="#DCC7A6" stroke-width="4" stroke-linecap="round">
        <path d="M-53 -50c22 16 40 40 48 68M-25 -68c26 20 47 52 56 89M24 -69c17 18 31 43 38 70"/>
      </g>
    </g>

    <!-- crochet hook -->
    <g transform="rotate(-24 690 250)">
      <rect x="640" y="180" width="9" height="150" rx="4.5" fill="#B98A5A"/>
      <path d="M644.5 180c0-14 14-14 14 -2s-13 12-13 2" fill="none" stroke="#B98A5A" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- loose thread -->
    <path d="M0 512c110 -34 190 6 268 26 92 24 168 -18 246 -34 66 -14 200 -6 286 22"
          fill="none" stroke="#C4663C" stroke-width="4" stroke-linecap="round" opacity=".5"/>
  </g>
</svg>
